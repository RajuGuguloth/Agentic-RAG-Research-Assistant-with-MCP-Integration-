name: Research Assistant CI

on:
  push:
    branches: [main]
    paths:
      - "research_assistant/**"
      - ".github/workflows/research-assistant-ci.yml"
  pull_request:
    paths:
      - "research_assistant/**"
      - ".github/workflows/research-assistant-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research_assistant/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run offline safety evaluation
        run: python evaluation/eval_safety.py --offline --output /tmp/safety_report.json
      - name: Run regression gate
        run: python evaluation/regression_gate.py --baseline /tmp/safety_report.json --candidate /tmp/safety_report.json
